name: Build Daman Duo (Android + Desktop)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Headless smoke test (game boots, renders, no JS errors)
        run: |
          python -m pip install --quiet playwright
          python tools/render_test.py --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: DamanDuo-Screenshots, path: test-out/*.png, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: DamanDuo-Web, path: dist-single/index.html }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - run: python3 -m pip install --quiet pillow
      - run: npx cap add android
      - run: python3 tools/patch_android.py
      - run: npx cap sync android
      - name: Keep the same signing key between builds (so updates install over the old app)
        uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: daman-duo-debug-keystore-v1 }
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/DamanDuo-Android.apk && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: DamanDuo-Android-APK, path: out/DamanDuo-Android.apk, if-no-files-found: error }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win }
          - { os: ubuntu-latest, target: linux }
          - { os: macos-latest, target: mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false', GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: DamanDuo-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg

  release:
    # Publishes a GitHub Release on version tags and on every push to main.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [web-and-smoke-test, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - run: |
          mkdir -p files
          find dl -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} files/ \;
          cp dl/DamanDuo-Web/index.html files/DamanDuo-Web.html
          ls -la files
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v$VER"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then TAG="v$VER-build.$GITHUB_RUN_NUMBER"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Daman Duo ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: files/*
          body_path: docs/RELEASE_NOTES.md
