name: Temple Realm gameplay checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEMPLE_ENV_ROOT: ${{ runner.temp }}/temple-realm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verified engine and hashed Python tools
        shell: bash
        run: |
          source tools/common.sh
          python3 tools/install_engine.py
          python3 -m venv "$TEMPLE_ENV_ROOT/venv"
          python -m pip install --only-binary=:all: --require-hashes -r tools/requirements.lock
      - name: Import, lint, gameplay and source checks
        shell: bash
        run: |
          source tools/common.sh
          checked_godot import --headless --editor --import
          python tools/gdtools.py lint scripts tests tools/render_capture.gd tools/startup_smoke.gd
          python tools/gdtools.py format --check scripts tests tools/render_capture.gd tools/startup_smoke.gd
          tools/start_environment.sh smoke
          tools/run_tests.sh
          python tools/security_scan.py
