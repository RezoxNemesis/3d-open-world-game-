<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Daman Duo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;pointer-events:none;z-index:5}
.ui *{pointer-events:auto}
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,#ff8a3d 0%,#b8325a 35%,#2a0f3d 70%,#07030c 100%);text-align:center;padding:env(safe-area-inset-top) 20px 20px}
#title h1{font-size:clamp(46px,9vw,120px);margin:0;letter-spacing:.12em;font-weight:900;text-shadow:0 6px 30px #0009;background:linear-gradient(#fff6e0,#ffc070);-webkit-background-clip:text;background-clip:text;color:transparent}
#title h2{margin:.2em 0 1.2em;font-weight:500;letter-spacing:.4em;opacity:.85;font-size:clamp(12px,2vw,18px)}
.btn{background:linear-gradient(#ffb347,#ff7a18);color:#2a0f00;border:0;border-radius:40px;padding:14px 46px;font-size:20px;font-weight:800;letter-spacing:.1em;cursor:pointer;box-shadow:0 8px 30px #0008}
.btn.alt{background:#ffffff22;color:#fff;font-weight:600;font-size:15px;padding:10px 22px;margin:6px;box-shadow:none;border:1px solid #fff4}
.btn.alt.on{background:#ffb347;color:#2a0f00}
#title .row{display:flex;flex-wrap:wrap;justify-content:center;margin:6px}
#title .lbl{font-size:12px;opacity:.7;letter-spacing:.2em;margin-top:14px}
#title .foot{position:absolute;bottom:12px;font-size:11px;opacity:.55;max-width:90%}
@media (max-height:520px){#title{justify-content:flex-start;overflow-y:auto;padding-top:calc(env(safe-area-inset-top) + 10px)}#title h1{font-size:clamp(34px,6.5vw,64px)}#title h2{margin:.1em 0 .6em;font-size:11px}#title .lbl{margin-top:4px}#title .row{margin:2px}.btn{padding:10px 40px;font-size:18px}.btn.alt{padding:7px 18px;font-size:13px;margin:4px}#title .foot{position:static;margin-top:8px;font-size:10px}}
#loading{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;background:#07030ce8}
#loading .bar{width:min(520px,80vw);height:6px;background:#fff2;border-radius:6px;overflow:hidden;margin-top:14px}
#loading .bar div{height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5e62);transition:width .2s}
#loading .msg{font-size:15px;opacity:.85;letter-spacing:.06em}
#loading .tip{margin-top:26px;font-size:13px;opacity:.6;max-width:80vw;text-align:center}
#hud{inset:0}
#topl{position:absolute;left:calc(14px + env(safe-area-inset-left));top:12px;display:flex;gap:10px}
.port{width:150px;background:#0008;border-radius:12px;padding:6px 8px;border:2px solid transparent;cursor:pointer}
.port.on{border-color:#ffb347}
.port b{font-size:13px;letter-spacing:.08em}
.port .hp{height:6px;background:#fff2;border-radius:4px;margin-top:4px;overflow:hidden}
.port .hp div{height:100%;background:linear-gradient(90deg,#3ddc84,#b6ff5c);width:100%}
.port .ar div{background:linear-gradient(90deg,#4fc3f7,#81d4fa)}
#topr{position:absolute;right:calc(14px + env(safe-area-inset-right));top:12px;text-align:right;font-weight:700;text-shadow:0 2px 6px #000}
#clock{font-size:22px}#money{color:#9dff8a;font-size:18px}#stars{color:#ffd54f;font-size:18px;letter-spacing:2px}#season{font-size:12px;opacity:.85}
#weapon{font-size:13px;opacity:.9}
#minimap{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:14px;width:190px;height:190px;border-radius:50%;overflow:hidden;border:3px solid #fff8;box-shadow:0 4px 18px #0009;background:#123}
#minimap canvas{width:100%;height:100%}
#prompt{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);background:#000a;padding:8px 18px;border-radius:20px;font-size:15px;display:none;white-space:nowrap}
#objective{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000a;padding:6px 16px;border-radius:14px;font-size:14px;max-width:46vw;text-align:center;display:none}
#subtitle{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-size:17px;text-align:center;max-width:70vw;text-shadow:0 2px 6px #000,0 0 2px #000;display:none}
#subtitle b{color:#ffb347}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:30px;font-weight:900;letter-spacing:.08em;text-shadow:0 4px 16px #000;display:none;text-align:center}
#speedo{position:absolute;right:calc(20px + env(safe-area-inset-right));bottom:200px;font-size:34px;font-weight:900;text-shadow:0 3px 10px #000;display:none;text-align:right}
#speedo small{font-size:13px;display:block;opacity:.8;font-weight:600}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{left:12px;top:0;width:2px;height:26px}#cross:after{top:12px;left:0;height:2px;width:26px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:#f00;opacity:0;transition:opacity .25s}
#cine{position:fixed;inset:0;pointer-events:none;z-index:30}#cine .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}#cine .t{top:0}#cine .b{bottom:0}#cine.on .bar{height:11vh}body.cine #hud>*:not(#subtitle):not(#toast){opacity:0;transition:opacity .5s}
#cine .card{position:absolute;left:0;right:0;top:20vh;text-align:center;opacity:0;transition:opacity .8s;text-shadow:0 3px 12px #000}#cine.on .card{opacity:1}
#cine h1{font-size:clamp(28px,6vw,64px);letter-spacing:.25em;margin:0;color:#fff;font-weight:900}#cine p{margin:6px 0 0;font-size:clamp(12px,1.8vw,18px);letter-spacing:.3em;color:#ffd54f;text-transform:uppercase}
#uw{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;background:radial-gradient(ellipse at 50% 40%,rgba(20,120,140,.10) 0%,rgba(5,60,80,.28) 55%,rgba(0,20,35,.72) 100%)}
#breath{position:fixed;left:50%;top:13%;transform:translateX(-50%);width:min(260px,40vw);opacity:0;transition:opacity .4s;pointer-events:none;z-index:6;text-align:center;font:600 12px system-ui;color:#dff8ff;letter-spacing:.2em;text-shadow:0 1px 4px #000}
#breath div{height:7px;margin-top:4px;border-radius:4px;background:#0008;overflow:hidden;border:1px solid #fff4}#breath i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4dd0e1,#b2ebf2);transition:width .2s}#breath.low i{background:#ff5252}
#combo{position:fixed;right:4%;top:38%;text-align:right;pointer-events:none;opacity:0;transition:opacity .3s;z-index:6;text-shadow:0 2px 10px #000}#combo.on{opacity:1}
#combo b{display:block;font:900 clamp(34px,6vw,64px)/1 system-ui;color:#ffca28}#combo span{font:700 12px system-ui;letter-spacing:.3em;color:#fff}
#combo.bump b{animation:cbump .25s ease-out}@keyframes cbump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.fpop{position:fixed;left:50%;top:30%;transform:translateX(-50%);font:900 clamp(22px,4vw,40px) system-ui;letter-spacing:.15em;pointer-events:none;z-index:7;text-shadow:0 3px 12px #000;animation:fpop 1.1s ease-out forwards}
@keyframes fpop{0%{opacity:0;transform:translate(-50%,10px) scale(1.4)}15%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
#boss{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:min(560px,60vw);display:none;text-align:center;font-weight:800;letter-spacing:.2em;font-size:13px;text-shadow:0 2px 6px #000}
#boss .hp{height:8px;background:#fff2;border-radius:6px;overflow:hidden;margin-top:4px}#boss .hp div{height:100%;background:linear-gradient(90deg,#8e24aa,#ff1744);width:100%}
#touch{inset:0;display:none}
#stick{position:absolute;left:calc(40px + env(safe-area-inset-left));bottom:40px;width:150px;height:150px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30}
#stick div{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#ffffff55}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;background:#0006;border:2px solid #ffffff40;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;letter-spacing:.03em}
.tb.big{width:84px;height:84px;font-size:14px;background:#ff7a1866}
.tb.on{background:#ffb347aa;color:#2a0f00}
.tb.hide{display:none}
#menu,#map,#help{position:fixed;inset:0;z-index:40;background:#05030ae6;display:none;align-items:center;justify-content:center;flex-direction:column}
#menu .panel{background:#ffffff10;border:1px solid #ffffff25;border-radius:18px;padding:22px 26px;min-width:min(520px,90vw);max-height:90vh;overflow:auto}
#menu h3{margin:0 0 10px;letter-spacing:.2em}
.setrow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:14px;font-size:14px}
.setrow .opts{display:flex;flex-wrap:wrap;justify-content:flex-end}
#map canvas{max-width:96vw;max-height:84vh;border-radius:10px;touch-action:none}
#map .hint{margin-top:8px;font-size:13px;opacity:.8}
#help .panel{max-width:820px;font-size:14px;line-height:1.55;background:#ffffff10;border-radius:16px;padding:20px 26px;max-height:90vh;overflow:auto}
kbd{background:#fff2;border-radius:4px;padding:1px 6px;font-family:inherit}
#fps{position:absolute;right:8px;bottom:4px;font-size:11px;opacity:.5}
#pausebtn{position:absolute;right:calc(14px + env(safe-area-inset-right));top:118px;width:44px;height:44px;border-radius:50%;background:#0007;border:2px solid #fff4;font-size:18px;display:flex;align-items:center;justify-content:center;color:#fff}
#mapbtn{position:absolute;left:calc(206px + env(safe-area-inset-left));bottom:18px;width:44px;height:44px;border-radius:50%;background:#0007;border:2px solid #fff4;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
@media (max-height:500px){#minimap{width:140px;height:140px}#mapbtn{left:calc(160px + env(safe-area-inset-left))}.port{width:120px}#stick{width:130px;height:130px;bottom:24px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<!--GAME-->
</body>
</html>
